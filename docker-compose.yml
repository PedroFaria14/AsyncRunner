version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    networks:
      - asyncflow-network

  frontend:
    build: ./frontend
    ports:
      - "5173:80" # Mapeia a porta 80 do container para a 5173 do seu PC
    depends_on:
      - backend
    networks:
      - asyncflow-network

      

networks:
  asyncflow-network:
    driver: bridge
